
{% extends 'base.html' %}

{% block content %}

<!-- PAGE HEADING -->
<section class="page-heading">

    <div class="container">

        <p class="eyebrow">
            Welcome back
        </p>

        <h1>
            Log In
        </h1>

    </div>

</section>


<!-- MAIN SECTION -->
<section class="section">

    <div class="container">

        <!-- LOGIN CARD -->
        <div
            class="soft-card p-4 mx-auto"
            style="max-width:490px"
        >

            <!-- LOGIN FORM -->
            <form method="post">

                {% csrf_token %}

                <!-- DJANGO LOGIN FIELDS -->
                {{ form.as_p }}


                <!-- LOGIN BUTTON -->
                <button class="btn btn-teal w-100">
                    Log In
                </button>

            </form>


            <!-- REGISTER LINK -->
            <p class="text-center mt-3 mb-0">

                New patient?

                <a href="{% url 'register' %}">
                    Create an account
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
